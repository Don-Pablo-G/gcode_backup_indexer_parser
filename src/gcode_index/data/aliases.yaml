# Fuzzy machine folder alias map for gcode-index.
# Keys are matched after normalize: lowercase, strip spaces/-/_, strip punctuation.
#
# layout:
#   haas_pgm       — expect *.pgm glued dump
#   fanuc_all_fldr — ALL-FLDR.TXT
#   fanuc_all_prog — ALL-PROG.TXT
#   haas_ngc       — HaasBackup(*)/Memory/**/*.nc
#   manual_nc_folder — individual *.nc under machine folder
#   (omit / any)   — route by filename only when known dumps present

machines:
  # Doosan DNM 6700 (FANUC ALL-FLDR) — "duży" = big
  doosand:
    machine_id: doosan-dnm-6700
    label: Doosan DNM 6700
    control_family: fanuc
    layout: fanuc_all_fldr
  doosanduzy:

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcode-index"
version = "0.2.48"
description = "Index CNC backup trees into a portable SQLite catalog of program instances"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gcode_backup_indexer_parser contributors" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pystray>=0.19",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
gcode-index = "gcode_index.cli:app"
gcode-index-gui = "gcode_index.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcode_index"]

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"aliases.yaml" = "gcode_index/data/aliases.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/aliases.yaml",
  "/gcode-index.ini.example",
  "/README.md",
  "/README.pl.md",
  "/docs",
  "/tests",
]

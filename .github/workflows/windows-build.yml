name: Windows GUI build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "aliases.yaml"
      - "gcode-index-gui.spec"
      - "scripts/build_windows.bat"
      - "scripts/zip_onedir.py"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "aliases.yaml"
      - "gcode-index-gui.spec"
      - "scripts/build_windows.bat"
      - "scripts/zip_onedir.py"
      - "pyproject.toml"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build tools
        run: python -m pip install -e ".[dev,build]"

      - name: Run tests (non-GUI)
        run: python -m pytest -q -k "not gui and not praca_preview and not alias_editor"

      - name: Build Windows GUI (PyInstaller onedir)
        run: scripts\build_windows.bat
        shell: cmd
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Resolve versioned zip path
        id: meta
        shell: pwsh
        run: |
          $ver = python -c "from gcode_index import __version__; print(__version__)"
          $build = "b$env:GITHUB_RUN_NUMBER"
          $zipName = "gcode-index-gui-windows-$ver-$build.zip"
          $zipPath = "dist\$zipName"
          if (-not (Test-Path $zipPath)) {
            throw "Missing versioned zip: $zipPath"
          }
          $artifact = "gcode-index-gui-windows-$ver-$build"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$build" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Item $zipPath | Format-List Name, Length, FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.zip_path }}
          if-no-files-found: error

      - name: Attach zip to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.zip_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
